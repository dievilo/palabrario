async function runBookImport(getMeta){
  const pg=progressSheet('Importando libro');
  try{
    pg.set('Descargando…',0.01);
    const meta=await getMeta(pg);
    const r=await buildBook(meta,pg);
    pg.close();render();
    const msg=r.pending
      ?`Sin conexión con el diccionario: guardé ${r.added} palabras sin definición. Ve a Palabras › Sin definición para completarlas cuando tengas internet.`
      :`«${r.title}» (~${r.pages} páginas). Añadidas ${r.added} palabras${r.added<r.target?` de las ${r.target} previstas (no encontré más con definición)`:''}.`;
    await infoDlg(r.added?'Libro añadido':'Nada que añadir',r.added?msg:'No se añadieron palabras.');
  }catch(e){pg.close();await infoDlg('No se pudo importar',e.message||'Error desconocido')}
}
function textUrlOf(b){
  const f=b.formats||{};
  const k=Object.keys(f).find(x=>/^text\/plain/.test(x)&&!/\.zip$/.test(f[x]))||Object.keys(f).find(x=>/^text\/html/.test(x)&&!/\.zip$/.test(f[x]));
  return k?f[k]:null;
}
async function gutSearch(){
  UI.gutQ=$('#gq').value.trim();UI.gutBusy=true;UI.gutErr='';renderGut();
  try{
    const url='https://gutendex.com/books/?languages='+enc(DB.lang)+'&copyright=false'+(UI.gutQ?'&search='+enc(UI.gutQ):'');
    const j=await netFetch(url,'json',20000);
    UI.gut=(j.results||[]).map(b=>({id:b.id,title:b.title,author:(b.authors&&b.authors[0]?b.authors[0].name:''),url:textUrlOf(b)})).filter(b=>b.url).slice(0,20);
    if(!UI.gut.length)UI.gutErr='No hay resultados en este idioma.';
  }catch(e){UI.gutErr='No se pudo consultar Gutenberg. Descarga el .txt desde gutenberg.org y súbelo con «Subir archivo».'}
  UI.gutBusy=false;renderGut();
}
function importGut(i){
  const b=UI.gut[i];if(!b)return;
  const previo=DB.books.find(x=>x.pg===b.id&&x.lang===DB.lang);
  if(previo){
    if(DB.words.some(w=>w.book===previo.id))return toast('Este libro ya está importado');
    DB.books=DB.books.filter(x=>x!==previo);       // libro vaciado: se puede volver a importar
  }
  runBookImport(async pg=>{
    let t=await netFetch(b.url,'text');
    if(looksHtml(t))t=htmlToText(t);
    return {text:t,title:b.title,author:b.author,pg:b.id};
  });
}
function importUrl(){
  const url=$('#uurl').value.trim();
  if(!/^https?:\/\//i.test(url))return toast('Pega un enlace que empiece por http');
  runBookImport(async pg=>{
    let t=await netFetch(url,'text');
    if(looksHtml(t))t=htmlToText(t);
    let title='';try{title=decodeURIComponent(new URL(url).pathname.split('/').filter(Boolean).pop()||'').replace(/\.[a-z]+$/i,'')}catch(e){}
    return {text:t,title};
  });
}
async function importFile(file){
  runBookImport(async pg=>{
    let t=await file.text();
    if(looksHtml(t))t=htmlToText(t);
    return {text:t,title:file.name.replace(/\.[a-z0-9]+$/i,'')};
  });
}
async function fillMissing(){
  const list=wordsOf().filter(w=>!hasDef(w));
  if(!list.length)return;
  const pg=progressSheet('Buscando definiciones');let ok=0,i=0;const repetidas=[];
  for(const w of list){
    if(pg.stop)break;
    pg.set(`${i}/${list.length}`,i/list.length);i++;
    try{
      const r=await lookup(w.word,w.lang,{bulk:true});
      if(r){
        const lema=r.lemma||w.word;
        if(norm(lema)!==norm(w.word)){
          if(DB.words.some(x=>x!==w&&x.lang===w.lang&&norm(x.word)===norm(lema))){repetidas.push(w);continue}
          w.orig=w.orig||w.word;w.word=lema;
        }
        applyLookup(w,r);ok++;
      }
    }catch(e){if(e.net&&i>4&&!ok)break}
  }
  if(repetidas.length)DB.words=DB.words.filter(w=>!repetidas.includes(w));
  save();pg.close();render();toast(`${ok} definiciones encontradas`+(repetidas.length?` · ${repetidas.length} repetidas por lema eliminadas`:''));
}

/* =====================================================================
   Exportar / importar la base de datos
   ===================================================================== */
function makeExport(){
  const copy=JSON.parse(JSON.stringify(DB));delete copy.settings.raeKey;
  const name='palabrario-'+new Date().toISOString().slice(0,10)+'.json';
  const blob=new Blob([JSON.stringify({app:'palabrario',version:1,exportedAt:new Date().toISOString(),db:copy})],{type:'application/json'});
  return {blob,name};
}
function exportDB(){
  const {blob,name}=makeExport();
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast('Copia descargada');
}
async function shareDB(){
  const {blob,name}=makeExport();
  try{await navigator.share({files:[new File([blob],name,{type:'application/json'})],title:name})}catch(e){}
}
async function importDB(file){
  let j;
  try{j=JSON.parse(await file.text())}catch(e){return infoDlg('Archivo no válido','No se pudo leer el archivo como una copia de Palabrario.')}
  const inc=j.db||j;
  if(!inc||!Array.isArray(inc.words))return infoDlg('Archivo no válido','El archivo no contiene una base de datos de Palabrario.');
  const d=fixDB(inc);
  openSheet(`<h3>Importar copia</h3>
    <p>Contiene <b>${d.words.length}</b> palabras, <b>${d.books.length}</b> libros y ${d.langs.length} idiomas.</p>
    <p class="muted small"><b>Fusionar</b> añade lo nuevo y conserva la nota más reciente de cada palabra. <b>Reemplazar</b> sustituye todo lo que tienes ahora.</p>
    <div class="gact" style="flex-direction:column"><button class="btn" id="mMerge">Fusionar con lo que tengo</button><button class="btn ghost" id="mRep" style="color:var(--bad)">Reemplazar todo</button><button class="btn ghost" id="mNo">Cancelar</button></div>`);
  $('#mNo').onclick=closeSheet;
  $('#mRep').onclick=async()=>{
    closeSheet();
    if(!await confirmDlg('¿Reemplazar todo?','Se perderá lo que hay ahora en la aplicación.','Reemplazar',true))return;
    const keep=DB.settings;DB=d;DB.settings={...d.settings,raeKey:keep.raeKey,proxy:keep.proxy,seeded:true};save();UI.book=null;UI.pool='all';render();toast('Copia restaurada');
  };
  $('#mMerge').onclick=()=>{
    closeSheet();
    d.langs.forEach(l=>{if(!DB.langs.some(x=>x.code===l.code))DB.langs.push(l)});
    const bmap=new Map();
    d.books.forEach(b=>{
      const ex=DB.books.find(x=>x.id===b.id||(b.pg&&x.pg===b.pg&&x.lang===b.lang));
      if(ex)bmap.set(b.id,ex.id);else{DB.books.push(b);bmap.set(b.id,b.id)}
    });
    const idx=new Map(DB.words.map(w=>[w.lang+'|'+norm(w.word),w]));
    let add=0,upd=0;
    d.words.forEach(w=>{
      w.book=w.book?(bmap.get(w.book)||null):null;
      const ex=idx.get(w.lang+'|'+norm(w.word));
      if(!ex){DB.words.push(w);idx.set(w.lang+'|'+norm(w.word),w);add++}
      else{
        if((w.last||0)>(ex.last||0)){ex.score=w.score;ex.last=w.last;ex.tries=Math.max(ex.tries||0,w.tries||0);upd++}
        ex.fav=ex.fav||w.fav;
        if(!hasDef(ex)&&hasDef(w)){ex.senses=w.senses;ex.syn=w.syn}
      }
    });
    DB.settings.seeded=true;save();render();toast(`${add} nuevas, ${upd} notas actualizadas`);
  };
}

/* =====================================================================
   Juego: 10 tarjetas; al responder solo se ve la resolución
   ===================================================================== */
function mask(text,word){
  const nw=norm(word);if(nw.length<3)return text;
  return text.replace(/\p{L}+/gu,tk=>{
    const n=norm(tk);
    if(n===nw)return '_____';
    if(Math.min(n.length,nw.length)<4)return tk;
    let k=0;while(k<n.length&&k<nw.length&&n[k]===nw[k])k++;
    return k>=Math.max(4,Math.min(n.length,nw.length)-2)?'_____':tk;
  });
}
function startGame(){
  const words=cardsFor(UI.pool);
  if(!words.length)return toast('No hay palabras para esta modalidad');
  G={dir:UI.dir,pool:UI.pool,cards:words.map(w=>{
    const cand=w.senses.filter(s=>s.t.length>=8).slice(0,3);
    const s=(cand.length?cand:w.senses)[Math.floor(Math.random()*(cand.length||w.senses.length))];
    return {w,sense:s,r:null,ans:''};
  }),i:0,phase:'ask'};
  $('#game').hidden=false;document.body.classList.add('noscroll');gameRender();
}
function gtop(){
  return `<div class="gtop"><button class="icon" data-act="gQuit" aria-label="Salir del juego">${ic.close}</button>
    <div class="segs">${G.cards.map((_,k)=>`<i class="${k<G.i?'done':k===G.i?'now':''}"></i>`).join('')}</div>
    <span class="cnt">${Math.min(G.i+1,G.cards.length)}/${G.cards.length}</span></div>`;
}
function gameRender(){
  const b=$('#gBody');
  const c=G.cards[G.i];
  if(G.phase==='ask'){
    const w=c.w;
    b.innerHTML=gtop()+(G.dir==='w2d'?`
      <div class="gmain"><div class="qcard"><div class="qhint">¿Qué significa?</div>
        <div class="qword"><span class="mark">${esc(w.word)}</span></div>${c.sense.p&&c.sense.k!=='sin'?`<div class="muted" style="margin-top:8px">${esc(c.sense.p)}</div>`:''}</div>
        <textarea id="ans" rows="4" placeholder="Escríbelo con tus palabras" autocomplete="off" aria-label="Tu respuesta"></textarea>
        <div class="gact"><button class="btn ghost" data-act="gSkip">No lo sé</button><button class="btn" data-act="gSubmit">Comprobar</button></div></div>`
    :`
      <div class="gmain"><div class="qcard"><div class="qhint">¿Qué palabra es?</div>
        <div class="qdef">${esc(mask(c.sense.t,w.word))}</div>${c.sense.p&&c.sense.k!=='sin'?`<div class="muted" style="margin-top:10px">${esc(c.sense.p)}</div>`:''}</div>
        <input type="text" id="ans" placeholder="Escribe la palabra" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-label="Tu respuesta">
        <div class="gact"><button class="btn ghost" data-act="gSkip">No lo sé</button><button class="btn" data-act="gSubmit">Comprobar</button></div></div>`);
    setTimeout(()=>{const a=$('#ans');if(a)a.focus()},60);
  }else if(G.phase==='grading'){
    b.innerHTML=gtop()+`<div class="gmain" style="text-align:center"><div><div class="spin"></div><p class="muted">Corrigiendo…</p></div></div>`;
  }else if(G.phase==='result'){
    b.innerHTML=gtop()+resultHTML(c);
    requestAnimationFrame(()=>{const f=$('.ring .fg');if(f)f.style.strokeDasharray=`${c.r.pct/100*326.7} 326.7`});
  }else{
    const avg=Math.round(G.cards.reduce((a,c)=>a+c.r.pct,0)/G.cards.length);
    b.innerHTML=`<div class="gtop"><button class="icon" data-act="gExit" aria-label="Cerrar">${ic.close}</button><div style="flex:1"></div></div>
      <div class="gmain"><div style="text-align:center"><h1 class="serif" style="font-size:34px">Nota media: <span class="mark">${avg}%</span></h1>
        <p class="muted">${G.cards.length} tarjetas · ${G.dir==='w2d'?'palabra → significado':'definición → palabra'}</p></div>
        <div class="card" style="padding:6px 16px">${G.cards.map(c=>`<div class="sum"><span class="serif" style="font-size:18px;font-weight:700">${esc(c.w.word)}</span>${pct(c.r.pct)}</div>`).join('')}</div>
        <div class="gact"><button class="btn ghost" data-act="gExit">Salir</button><button class="btn mark" data-act="gAgain">Jugar otra vez</button></div></div>`;
  }
  $('#game').scrollTop=0;
}
function verdictOf(r){
  const p=r.pct;
  if(r.kind==='skip')return 'Sin respuesta';
  if(p>=95)return '¡Exacto!';if(p>=75)return 'Muy bien';if(p>=50)return 'Te acercas';if(p>=20)return 'Algo de idea';return 'Fallaste';
}
function noteOf(c){
  const r=c.r;
  if(G.dir==='d2w'){
    if(r.kind==='accent')return 'Cuidado con las tildes.';
    if(r.kind==='typo')return 'Casi: hay letras de diferencia.';
    if(r.kind==='form')return 'Es otra forma de la misma palabra.';
    if(r.kind==='syn')return `«${c.ans}» es sinónimo, así que cuenta casi como acierto.`;
    if(r.kind==='related')return `«${c.ans}» tiene un significado cercano.`;
    if(r.offline&&r.pct<100)return 'Sin conexión: no pude comprobar si tu palabra es un sinónimo.';
  }else{
    if(r.kind==='syn')return r.info?`Tu respuesta incluye «${r.info.word}», que es sinónimo de la palabra.`:'Has dado un sinónimo de la palabra.';
    if(r.kind==='related')return r.info?`Tu respuesta usa «${r.info.word}», de significado cercano.`:'Tu respuesta se acerca al significado.';
    if(r.offline&&r.pct<85)return 'Sin conexión: solo pude comparar con las palabras de la definición, no con su significado real.';
  }
  return '';
}
function resultHTML(c){
  const r=c.r,w=c.w,t=tone(r.pct),note=noteOf(c);
  return `<div class="gmain" style="justify-content:flex-start">
    <div><div class="ring ${t}"><svg viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="52"/><circle class="fg" cx="60" cy="60" r="52" style="stroke-dasharray:0 326.7"/></svg><div class="num">${r.pct}%</div></div>
      <h2 class="verdict">${verdictOf(r)}</h2><p class="sub">${esc(note)||'&nbsp;'}</p></div>
    <div class="blk"><div class="lbl">Tu respuesta</div><div>${c.ans?esc(c.ans):'<span class="muted">(sin respuesta)</span>'}</div></div>
    <div class="blk"><div class="lbl">Solución</div><div class="w"><span class="mark">${esc(w.word)}</span></div>
      <ul class="sense">${w.senses.map(s=>`<li>${s.p?`<span class="p">${esc(s.p)}.</span>`:''}${esc(s.t)}</li>`).join('')}</ul>
      ${(w.syn&&w.syn.length&&!w.senses.some(x=>x.k==='sin'))?`<div class="muted small" style="margin-top:8px">Sinónimos: ${esc(w.syn.join(', '))}</div>`:''}</div>
    ${r.info?`<div class="blk"><div class="lbl">${G.dir==='d2w'?'Tu palabra':'La palabra de tu respuesta'} «${esc(r.info.word)}» significa</div><div>${esc(r.info.text)}</div></div>`:''}
    <div class="gact"><button class="btn ghost star ${w.fav?'on':''}" style="width:56px;height:auto;flex:none" data-act="gFav" aria-label="Favorita">${ic.star}</button>
      <button class="btn" data-act="gNext">${G.i>=G.cards.length-1?'Ver resultados':'Siguiente'}</button></div></div>`;
}
async function submitAnswer(skip){
  const c=G.cards[G.i],w=c.w;
  const ans=skip?'':($('#ans').value||'').trim();
  if(!skip&&!ans)return toast('Escribe una respuesta o pulsa «No lo sé»');
  G.phase='grading';gameRender();          // la pantalla de respuesta desaparece
  let r;
  if(skip)r={pct:0,kind:'skip'};
  else if(G.dir==='w2d'){
    r=gradeMeaning(ans,w);
    if(r.pct<85){try{r=await semanticBoostMeaning(ans,w,r)}catch(e){r={...r,offline:true}}}
  }else{
    r=gradeWord(ans,w);
    if(r.pct<100){try{r=await semanticBoost(ans,w,r)}catch(e){r={...r,offline:true}}}
  }
  w.score=r.pct;w.last=Date.now();w.tries=(w.tries||0)+1;save();
  c.r=r;c.ans=ans;G.phase='result';gameRender();
}
async function quitGame(){
  if(G&&G.phase!=='end'&&!await confirmDlg('¿Salir del juego?','Se conservan las notas de las tarjetas que ya has respondido.','Salir'))return;
  exitGame();
}
function exitGame(){G=null;$('#game').hidden=true;if($('#sheetWrap').hidden)document.body.classList.remove('noscroll');render()}

/* =====================================================================
   Eventos
   ===================================================================== */
const ACT={
  dir(t){UI.dir=t.dataset.v;render()},
  pool(t){if(t.hasAttribute('disabled'))return;UI.pool=t.dataset.v;render()},
  play(){startGame()},
  fav(t,e){
    e.stopPropagation();
    const w=DB.words.find(x=>x.id===t.dataset.id);if(!w)return;
    w.fav=!w.fav;save();
    t.classList.toggle('on',w.fav);t.setAttribute('aria-label',w.fav?'Quitar de favoritas':'Marcar como favorita');
    if(UI.filter==='fav')renderWordList();
  },
  editWord(t){wordSheet(t.dataset.id)},
  addWord(){wordSheet(null)},
  fillDef(){fillDef()},
  useFull(){const w=DB.words.find(x=>x.id===WS.id);if(w&&w.full&&w.full.length){$('#wf-def').value=w.full.map(x=>x.t).join('\n');toast('Definición completa de la RAE')}},
  saveWord(){saveWord()},
  async delWord(){
    if(!await confirmDlg('¿Eliminar esta palabra?','Se quitará de la base de datos junto con su nota.','Eliminar',true))return;
    DB.words=DB.words.filter(x=>x.id!==WS.id);save();render();toast('Palabra eliminada');
  },
  closeSheet(){closeSheet()},
  filter(t){UI.filter=t.dataset.v;UI.fbook='';UI.show=60;render()},
  more(){UI.show+=100;renderWordList()},
  fillMissing(t,e){e.preventDefault();fillMissing()},
  langSheet(){langSheet()},
  setLang(t){DB.lang=t.dataset.code;save();UI.book=null;UI.pool='all';UI.filter='all';UI.fbook='';UI.gut=[];UI.gutErr='';closeSheet();render(false)},
  addLang(){addLangSheet()},
  preset(t){$('#nl-name').value=t.dataset.name;$('#nl-code').value=t.dataset.code},
  saveLang(){saveLang()},
  async delLang(t){
    const code=t.dataset.code,n=DB.words.filter(w=>w.lang===code).length;
    if(!await confirmDlg('¿Eliminar el idioma?',`Se borrarán también sus ${n} palabras y sus libros.`,'Eliminar',true))return;
    DB.langs=DB.langs.filter(l=>l.code!==code);DB.words=DB.words.filter(w=>w.lang!==code);DB.books=DB.books.filter(b=>b.lang!==code);save();render();
  },
  gutSearch(){gutSearch()},
  impGut(t){importGut(+t.dataset.i)},
  impUrl(){importUrl()},
  impFile(){$('#ufile').click()},
  perH(t){DB.settings.perHundred=Math.max(10,Math.min(100,DB.settings.perHundred+ +t.dataset.v));save();render()},
  showBook(t){UI.fbook=t.dataset.id;UI.filter='all';UI.show=60;tab='words';render(false)},
  async delBook(t){
    const b=DB.books.find(x=>x.id===t.dataset.id);if(!b)return;
    const n=DB.words.filter(w=>w.book===b.id).length;
    openSheet(`<h3>Quitar «${esc(b.title)}»</h3><p class="muted">Tiene ${n} palabras. ¿Qué hago con ellas?</p>
      <div class="gact" style="flex-direction:column"><button class="btn ghost" id="bKeep">Conservar las palabras</button><button class="btn danger" id="bDel">Quitar también las palabras</button><button class="btn ghost" id="bNo">Cancelar</button></div>`);
    $('#bNo').onclick=closeSheet;
    $('#bKeep').onclick=()=>{DB.words.forEach(w=>{if(w.book===b.id)w.book=null});DB.books=DB.books.filter(x=>x.id!==b.id);save();closeSheet();render()};
    $('#bDel').onclick=()=>{DB.words=DB.words.filter(w=>w.book!==b.id);DB.books=DB.books.filter(x=>x.id!==b.id);save();closeSheet();render()};
  },
  async delBookWords(){
    const b=DB.books.find(x=>x.id===UI.fbook);if(!b)return;
    const n=DB.words.filter(w=>w.book===b.id).length;if(!n)return;
    if(!await confirmDlg('¿Eliminar todas las palabras del libro?',`Se borrarán las ${n} palabras de «${b.title}» con sus notas. El libro seguirá en tu lista y podrás volver a importarlo.`,'Eliminar todas',true))return;
    DB.words=DB.words.filter(w=>w.book!==b.id);save();render();toast(`${n} palabras eliminadas`);
  },
  export(){exportDB()},
  share(){shareDB()},
  importPick(){$('#ifile').click()},
  async limpiarDefs(){
    const lista=DB.words.filter(w=>w.lang==='es'&&w.dsrc&&((w.full&&w.full.length)||w.senses.length));
    if(!lista.length)return toast('No hay definiciones del diccionario que procesar');
    if(!await confirmDlg('¿Limpiar y simplificar?',`Se procesarán ${lista.length} palabras en español con el estilo elegido. Si de alguna no queda ninguna definición útil, pasará a «Sin definición» para que puedas buscarla de nuevo.`,'Procesar'))return;
    let cambiadas=0,vaciadas=0;
    lista.forEach(w=>{
      const base=(w.full&&w.full.length?w.full:w.senses).filter(x=>x.k!=='sin');
      const fuente=limpiaDefs(base);
      const nuevas=simplificaDefs(fuente,w.syn||[],w.word,DB.settings.estilo||'auto');
      const igual=nuevas.length===w.senses.length&&nuevas.every((x,i)=>x.t===w.senses[i].t);
      w.full=fuente;
      if(igual)return;
      cambiadas++;if(!nuevas.length)vaciadas++;
      w.senses=nuevas;
    });
    save();render();toast((cambiadas===1?'1 palabra procesada':`${cambiadas} palabras procesadas`)+(vaciadas?` · ${vaciadas} sin definición`:''));
  },
  async resetScores(){
    if(!await confirmDlg('¿Reiniciar notas?','Las palabras de este idioma volverán a estar sin practicar.','Reiniciar',true))return;
    wordsOf().forEach(w=>{w.score=null;w.last=null;w.tries=0});save();render();toast('Notas reiniciadas');
  },
  gQuit(){quitGame()},
  gSkip(){submitAnswer(true)},
  gSubmit(){submitAnswer(false)},
  gFav(t){const w=G.cards[G.i].w;w.fav=!w.fav;save();t.classList.toggle('on',w.fav)},
  gNext(){G.i++;G.phase=G.i>=G.cards.length?'end':'ask';if(G.phase==='end')G.i=G.cards.length-1;gameRender()},
  gAgain(){const d=G.dir;G=null;UI.dir=d;startGame()},
  gExit(){exitGame()},
};
