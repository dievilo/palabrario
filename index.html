<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12203B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Palabrario</title>
<style>
:root{
  --paper:#F1F3F7; --card:#FFFFFF; --ink:#12203B; --muted:#5A667B; --line:#DCE1EA;
  --marker:#FFD84A; --marker-soft:#FFF4C2; --blue:#2A56E8;
  --good:#137A4E; --good-bg:#DDF3E8; --mid:#93610A; --mid-bg:#FFEFC2; --bad:#B4321F; --bad-bg:#FBE0DA;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --paper:#0E1420; --card:#171F31; --ink:#EBF0F8; --muted:#98A4BB; --line:#27324B;
    --marker:#EFCB3D; --marker-soft:#35300F; --blue:#8AA6FF;
    --good:#55CB92; --good-bg:#12362A; --mid:#E7B93F; --mid-bg:#3A3010; --bad:#F38B7B; --bad-bg:#40201B;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 var(--sans);min-height:100vh}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-family:var(--serif);letter-spacing:-.01em}
h2{font-size:20px;margin-bottom:6px}
h3{font-size:20px;margin-bottom:8px}
p{margin:0 0 10px}
.serif{font-family:var(--serif)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* Cabecera y navegación */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:700;font-size:23px;letter-spacing:-.02em}
.chip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:6px 14px;font-weight:600;cursor:pointer}
#view{max-width:560px;margin:0 auto;padding:16px 16px 120px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabs .in{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;border:0;background:none;padding:8px 0 9px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer}
.tabs .ti{display:grid;place-items:center;padding:3px 18px;border-radius:999px}
.tabs button.on{color:var(--ink)}
.tabs button.on .ti{background:var(--marker);color:#12203B}

/* Componentes */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:700;cursor:pointer;background:var(--ink);color:var(--paper);text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.mark{background:var(--marker);color:#12203B;font-size:18px;padding:16px 18px}
.btn.danger{background:var(--bad);color:#fff}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.small{padding:8px 12px;font-size:14px;border-radius:10px}
.icon{width:42px;height:42px;display:grid;place-items:center;border-radius:12px;border:0;background:transparent;cursor:pointer}
.gact{display:flex;gap:10px;margin-top:14px}
.gact .btn{flex:1}
input[type=text],input[type=search],input[type=url],input[type=password],select,textarea{
  width:100%;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:96px}
label.f{display:block;font-weight:600;font-size:14px;margin:12px 0 5px}
.inline{display:flex;gap:8px}
.inline .btn{flex:none}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{flex:1;border:0;border-radius:11px;background:transparent;padding:10px 6px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1.5px var(--ink) inset}
.hero{padding:6px 2px 14px}
.hero .big{font-family:var(--serif);font-size:38px;line-height:1.05;font-weight:700;letter-spacing:-.02em}
.pool{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.pool .dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:2px;display:grid;place-items:center}
.pool.on{border-color:var(--ink);background:var(--marker-soft)}
.pool.on .dot{border-color:var(--ink)}
.pool.on .dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--ink)}
.pool[disabled]{opacity:.5;cursor:not-allowed}
.pool b{display:block}
.pool .small{display:block;line-height:1.35;margin-top:2px}
.pool .n{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted)}
.pool select{margin-top:8px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.mid{background:var(--mid-bg);color:var(--mid)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.none{background:var(--line);color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button,.chips select{flex:none;width:auto;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:600;cursor:pointer;font-size:14px}
.chips button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 8px 11px 14px;margin-bottom:8px;cursor:pointer}
.row .rmain{flex:1;min-width:0}
.row .rw{font-family:var(--serif);font-size:19px;font-weight:700;line-height:1.2}
.row .rd{color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.off .rw{color:var(--muted);text-decoration:line-through}
.star{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;color:var(--muted);border-radius:10px}
.star.on{color:#E0A400}
.star.on .ic{fill:currentColor}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:15;border-radius:999px;padding:14px 20px;display:flex;gap:6px;align-items:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin:12px 0}
.bar i{display:block;height:100%;background:var(--ink);width:0;transition:width .25s}
.empty{text-align:center;padding:28px 12px}
.empty .serif{font-size:26px;font-weight:700;margin-bottom:8px}
.sw{display:flex;align-items:center;gap:10px;margin:10px 0;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--ink)}
.book{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.book:last-child{border:0}
.book .t{font-family:var(--serif);font-weight:700;font-size:17px;line-height:1.2}
.stepper{display:flex;align-items:center;gap:14px}
.stepper b{font-size:22px;min-width:34px;text-align:center;font-family:var(--serif)}
.stepper .btn{width:44px;padding:8px 0}
.lang{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.lang.on b::after{content:" (activo)";font-weight:400;color:var(--muted)}

/* Hojas modales */
.wrap{position:fixed;inset:0;z-index:80;background:rgba(8,12,22,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
.toast{width:max-content;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:90;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:600;max-width:90vw;text-align:center}

/* Juego */
.game{position:fixed;inset:0;z-index:60;background:var(--paper);overflow:auto}
.gwrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.gtop{display:flex;align-items:center;gap:10px}
.segs{display:flex;gap:4px;flex:1}
.segs i{flex:1;height:6px;border-radius:9px;background:var(--line)}
.segs i.done{background:var(--ink)}
.segs i.now{background:var(--marker);outline:1.5px solid var(--ink)}
.cnt{font-variant-numeric:tabular-nums;font-weight:700;color:var(--muted);min-width:42px;text-align:right}
.gmain{flex:1;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:18px 0}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 20px;text-align:center}
.qhint{color:var(--muted);font-weight:600;margin-bottom:12px}
.qword{font-family:var(--serif);font-size:40px;line-height:1.15;font-weight:700;letter-spacing:-.02em;word-break:break-word}
.qdef{font-family:var(--serif);font-size:23px;line-height:1.4}
.mark{background:linear-gradient(transparent 58%,var(--marker) 58%,var(--marker) 90%,transparent 90%);padding:0 .08em}
.ring{position:relative;width:132px;height:132px;margin:0 auto 6px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{transition:stroke-dasharray .7s cubic-bezier(.2,.7,.2,1)}
.ring.good .fg{stroke:var(--good)} .ring.mid .fg{stroke:var(--mid)} .ring.bad .fg{stroke:var(--bad)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:36px;font-weight:700}
.verdict{text-align:center;font-size:26px;margin:4px 0 2px}
.sub{text-align:center;color:var(--muted);margin-bottom:14px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.blk .lbl{font-size:13.5px;color:var(--muted);font-weight:600;margin-bottom:4px}
.blk .w{font-family:var(--serif);font-size:28px;font-weight:700;margin-bottom:4px}
.sense{margin:6px 0 0;padding-left:0;list-style:none}
.sense li{margin-bottom:5px}
.sense .p{color:var(--muted);font-style:italic;margin-right:4px}
.sum{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.spin{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ink);animation:sp .8s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet,.spin,.ring .fg,.bar i{animation:none;transition:none}}
</style>
</head>
<body>
<noscript>Esta aplicación necesita JavaScript.</noscript>

<header class="top">
  <div class="brand">Palabrario</div>
  <button class="chip" id="langBtn" data-act="langSheet" aria-label="Cambiar idioma"></button>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="Secciones"><div class="in">
  <button data-tab="study"><span class="ti" id="i-study"></span>Estudiar</button>
  <button data-tab="words"><span class="ti" id="i-words"></span>Palabras</button>
  <button data-tab="books"><span class="ti" id="i-books"></span>Libros</button>
  <button data-tab="data"><span class="ti" id="i-data"></span>Datos</button>
</div></nav>

<div class="game" id="game" hidden><div class="gwrap" id="gBody"></div></div>
<div class="wrap" id="sheetWrap" hidden><div class="sheet" id="sheetBody" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="ufile" accept=".txt,.text,.html,.htm,text/plain,text/html" hidden>
<input type="file" id="ifile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =====================================================================
   Utilidades
   ===================================================================== */
const $=(s,el=document)=>el.querySelector(s);
const $$=(s,el=document)=>[...el.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const enc=encodeURIComponent;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const ic={
  study:'<svg class="ic" viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M7.5 10h9M7.5 14h5"/></svg>',
  words:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 6.5h14M5 12h14M5 17.5h8"/></svg>',
  books:'<svg class="ic" viewBox="0 0 24 24"><path d="M5 4.5h9.5A3.5 3.5 0 0 1 18 8v11.5H8.5A3.5 3.5 0 0 1 5 16z"/><path d="M5 16a3.5 3.5 0 0 1 3.5-3.5H18"/></svg>',
  data:'<svg class="ic" viewBox="0 0 24 24"><ellipse cx="12" cy="6" rx="7" ry="2.7"/><path d="M5 6v12c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7V6M5 12c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7"/></svg>',
  star:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 3.8l2.5 5.2 5.7.8-4.1 4 1 5.7L12 16.8 6.9 19.5l1-5.7-4.1-4 5.7-.8z"/></svg>',
  close:'<svg class="ic" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus:'<svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  caret:'<svg class="ic" style="width:16px;height:16px" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>'
};

/* =====================================================================
   Análisis de texto (normalización, raíces, similitud)
   ===================================================================== */
const norm=s=>String(s||'').toLowerCase().replace(/ñ/g,'ɲ').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim();

const mkSet=str=>new Set(str.split(/\s+/).filter(Boolean).map(norm));
const STOP={
  es:mkSet('a al algo algun alguna algunas alguno algunos ante como con contra cual cuales cuando de del desde donde e el ella ellas ello ellos en entre era eran es esa esas ese eso esos esta estaba estan este esto estos fue ha han hasta hay la las le les lo los mas me mi mis muy nada ni no nos o os otra otro para pero por porque que quien se sea segun ser si sin sobre son su sus tambien tan tanto te tiene tienen todo todos tu tus un una uno unos y ya cuyo cuya asi aun'),
  en:mkSet('a about after all also an and any are as at be because been but by can could did do does for from had has have he her his how i if in into is it its just me more most my no not of on one or our out she so some such than that the their them then there these they this to too up was we were what when which who will with would you your being having making very much many'),
};
const GENERIC={
  es:mkSet('dicho cosa persona accion efecto hacer hace forma modo manera tipo parte conjunto uso usa algo alguien'),
  en:mkSet('thing person act action make makes made used use type kind part way something someone especially'),
};
const EMPTY=new Set();
const ES_SUF=['amientos','imientos','amiento','imiento','aciones','uciones','adoras','adores','acion','ucion','adora','ador','mente','eces','ez','idades','idad','ismos','ismo','istas','ista','ables','ibles','able','ible','osas','osos','osa','oso','ivas','ivos','iva','ivo','ando','iendo','ados','adas','ado','ada','idos','idas','ido','ida','ar','er','ir','es','as','os','s','a','o','e'];
const EN_SUF=['ations','ation','ingly','ments','ment','ness','ings','ing','edly','ies','ied','ed','es','ly','er','s','y','e'];
function stemOf(t,lang){
  const list=lang==='es'?ES_SUF:lang==='en'?EN_SUF:null;
  if(list){for(const suf of list){if(t.length-suf.length>=4&&t.endsWith(suf))return t.slice(0,-suf.length);}return t;}
  return t.length>6?t.slice(0,6):t;
}
// Palabras con acentos, tal como aparecen en el texto (la lematización del español los necesita)
function tokenizaConAcentos(texto){
  const salida=[];let actual='';
  for(const ch of String(texto).toLowerCase())esLetra(ch)?actual+=ch:(actual&&salida.push(actual),actual='');
  if(actual)salida.push(actual);
  return salida;
}
// Reduce una palabra a una forma comparable: primero se lematiza de verdad (con las mismas reglas que se
// usan para consultar la RAE: plural -> singular, conjugación -> infinitivo, femenino -> masculino…); solo
// si no se reconoce ninguna forma segura se recorta la raíz como respaldo, para no dejar la palabra tal cual.
function raizComparable(tokenAcentuado,plano,lang){
  if(lang==='es'){
    const enCache=memo.get(lang+'|'+tokenAcentuado.toLowerCase());  // ya se comprobó esta palabra en el diccionario antes
    if(enCache&&enCache.lemma)return norm(enCache.lemma);
    const candidatos=lemmasEs(tokenAcentuado);
    const lema=candidatos.length?norm(candidatos[0]):plano;
    if(lema!==plano)return lema;                  // se ha reconocido una forma flexionada: se usa el lema
  }
  return stemOf(plano,lang);                       // ya es una forma base, o no es español: se recorta la raíz
}
function terms(text,lang){
  const seen=new Map();
  for(const tk of tokenizaConAcentos(text)){
    const plano=norm(tk);
    if(plano.length<3)continue;
    if((STOP[lang]||EMPTY).has(plano))continue;
    const s=raizComparable(tk,plano,lang);
    if(!seen.has(s))seen.set(s,(GENERIC[lang]||EMPTY).has(plano)?0.4:1);
  }
  return [...seen].map(([s,w])=>({s,w}));
}
function lev(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i];
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    }
    prev=cur;
  }
  return prev[b.length];
}
function same(a,b){
  if(a===b)return true;
  const m=Math.min(a.length,b.length);
  if(m>=4&&(a.startsWith(b)||b.startsWith(a)))return true;
  if(m>=5&&lev(a,b)<=1)return true;
  return false;
}

/* =====================================================================
   Calificación de respuestas
   ===================================================================== */
// Palabra -> significado: compara lo escrito con las definiciones guardadas
function gradeMeaning(user,w){
  const lang=w.lang;
  const head=stemOf(norm(w.word),lang);
  const uT=terms(user,lang).filter(t=>!same(t.s,head));
  if(!uT.length)return {pct:0,kind:'none'};
  const propias=w.senses.filter(s=>s.k!=='sin').concat(w.full||[]);       // definición breve + texto completo de la RAE
  const senses=propias.map(s=>terms(s.t,lang));
  const all=[];senses.forEach(a=>a.forEach(t=>all.push(t)));
  const synT=[];(w.syn||[]).forEach(s=>terms(s,lang).forEach(t=>synT.push(t)));
  if(!senses.length&&synT.length){senses.push(synT);synT.forEach(t=>all.push(t))}
  let best=0;
  for(const K of senses){
    if(!K.length)continue;
    let tot=0,got=0;
    K.forEach(k=>{tot+=k.w;if(uT.some(u=>same(u.s,k.s)))got+=k.w});
    best=Math.max(best,tot?got/tot:0);
  }
  let hit=0;
  uT.forEach(u=>{if(all.some(k=>same(u.s,k.s))||synT.some(k=>same(u.s,k.s)))hit++});
  const precision=hit/uT.length;
  const raw=0.75*best+0.25*precision*(best>0?1:0.5);
  let pct=Math.round(100*Math.pow(Math.min(1,raw/0.7),1.15));
  let kind='meaning';
  // ¿ha escrito un sinónimo de la palabra?
  const un=' '+norm(user)+' ';
  const synExact=(w.syn||[]).some(s=>{const n=norm(s);return n&&un.includes(' '+n+' ')});
  if(synExact&&pct<80){pct=80;kind='syn'}
  else if(!synExact&&synT.length&&uT.some(u=>synT.some(k=>same(u.s,k.s)))&&pct<55){pct=55;kind='syn'}
  return {pct:Math.min(100,pct),kind};
}
// Definición -> palabra
function gradeWord(user,w){
  const a=user.trim().toLowerCase(),b=w.word.trim().toLowerCase();
  if(!a)return {pct:0,kind:'none'};
  if(a===b)return {pct:100,kind:'exact'};
  const na=norm(a),nb=norm(b);
  if(na===nb)return {pct:95,kind:'accent'};
  if((w.syn||[]).some(s=>norm(s)===na))return {pct:85,kind:'syn'};
  const L=Math.max(na.length,nb.length),d=lev(na,nb);
  if(L>=5&&d<=Math.max(1,Math.floor(L*0.2)))return {pct:Math.max(60,100-d*12),kind:'typo'};
  if(Math.min(na.length,nb.length)>=4&&same(stemOf(na,w.lang),stemOf(nb,w.lang)))return {pct:72,kind:'form'};
  return {pct:0,kind:'miss'};
}
// Refuerzo online: si la palabra escrita es sinónimo o tiene un significado cercano
const textoDe=(r,lang)=>lang==='es'?(acortaAcepcion(r.defs[0].t)||r.defs[0].t):r.defs[0].t;
async function semanticBoost(ans,w,base){
  const timeout=sleep(7000).then(()=>{const e=new Error('t');e.net=true;throw e});
  const r=await Promise.race([lookup(ans,w.lang,{}),timeout]);
  if(!r)return base;
  let pct=base.pct,kind=base.kind;
  const info={word:ans,text:textoDe(r,w.lang)};
  const tn=norm(w.word);
  if((r.syn||[]).some(s=>norm(s)===tn)){if(82>pct){pct=82;kind='syn'}}
  else{
    const textoW=w.senses.filter(s=>s.k!=='sin').concat(w.full||[]).map(s=>s.t).join(' ');
    const A=terms(r.defs.map(d=>d.t).join(' '),w.lang),B=terms(textoW,w.lang);
    let inter=0;A.forEach(a=>{if(B.some(b=>same(a.s,b.s)))inter++});
    const sim=A.length&&B.length?inter/Math.sqrt(A.length*B.length):0;
    let p=Math.min(70,Math.round(sim*140));
    if(norm(textoW).split(' ').includes(norm(ans)))p=Math.max(p,40);
    if(p>=15&&p>pct){pct=p;kind='related'}
  }
  return {...base,pct,kind,info};
}
// Palabras con contenido de una respuesta libre (sin acentos para comparar, pero se buscan con su forma original)
function palabrasClave(texto,lang){
  const vistas=new Set(),salida=[];let actual='';
  const cierra=()=>{
    if(actual.length>=4){
      const n=norm(actual);
      if(!(STOP[lang]||EMPTY).has(n)&&!vistas.has(n)){vistas.add(n);salida.push(actual)}
    }
    actual='';
  };
  for(const ch of String(texto))esLetra(ch)?actual+=ch:cierra();
  cierra();
  return salida;
}
// Aproximación semántica de una respuesta libre ("palabra → significado"): aunque el usuario no use las
// mismas palabras que la definición, se buscan en el diccionario las palabras de su respuesta y se compara
// el significado de esas palabras con el de la palabra a adivinar. Es una aproximación, no una comprensión
// real del texto: dos palabras solo se consideran cercanas si sus propias definiciones comparten vocabulario.
async function semanticBoostMeaning(ans,w,base){
  const lang=w.lang,head=stemOf(norm(w.word),lang);
  const candidatas=palabrasClave(ans,lang).filter(p=>!same(stemOf(norm(p),lang),head)).slice(0,4);
  if(!candidatas.length)return base;
  const textoW=w.senses.filter(s=>s.k!=='sin').concat(w.full||[]).map(s=>s.t).join(' ')+' '+(w.syn||[]).join(' ');
  const B=terms(textoW,lang);
  const tn=norm(w.word);
  // Cada palabra se consulta con su propio límite de tiempo, para que una palabra rara o sin conexión
  // no retrase (ni eche a perder) la aproximación de las demás palabras de la respuesta
  let sinRed=false;
  const consulta=async p=>{
    try{return await Promise.race([lookup(p,lang,{}),sleep(4000).then(()=>{const e=new Error('t');e.timeout=true;throw e})])}
    catch(e){if(e&&e.net&&!e.timeout)sinRed=true;return null}
  };
  const respuestas=await Promise.all(candidatas.map(consulta));
  let pct=base.pct,kind=base.kind,mejor=null;
  respuestas.forEach((r,i)=>{
    if(!r)return;
    if((r.syn||[]).some(s=>norm(s)===tn)){                    // la palabra usada es sinónimo de la que hay que adivinar
      if(pct<85){pct=85;kind='syn';mejor={word:candidatas[i],text:textoDe(r,lang)}}
      return;
    }
    if(!B.length)return;
    const A=terms(r.defs.map(d=>d.t).join(' '),lang);
    if(!A.length)return;
    let inter=0;A.forEach(a=>{if(B.some(b=>same(a.s,b.s)))inter++});
    const sim=inter/Math.sqrt(A.length*B.length);
    const p=Math.min(65,Math.round(sim*150));
    if(p>=18&&p>pct){pct=p;kind='related';mejor={word:candidatas[i],text:textoDe(r,lang)}}
  });
  if(mejor)return {...base,pct,kind,info:mejor};
  return sinRed?{...base,offline:true}:base;
}
const tone=p=>p==null?'none':p>=75?'good':p>=40?'mid':'bad';

async function fetchT(url,{as='json',timeout=9000}={}){
  const ac=new AbortController();const t=setTimeout(()=>ac.abort(),timeout);
  try{
    const r=await fetch(url,{signal:ac.signal});
    if(r.status===404)return null;
    if(!r.ok){const e=new Error('http '+r.status);e.net=true;e.status=r.status;throw e}
    return as==='json'?await r.json():await r.text();
  }catch(e){
    if(e.net)throw e;
    const er=new Error('network');er.net=true;throw er;
  }finally{clearTimeout(t)}
}
// Descarga con proxy CORS de reserva (algunos sitios no permiten leer desde el navegador)
async function netFetch(url,as='text',timeout=45000){
  const tries=[url];
  if(DB.settings.proxy){
    tries.push('https://corsproxy.io/?url='+enc(url));
    tries.push('https://api.allorigins.win/raw?url='+enc(url));
  }
  for(const u of tries){
    try{const r=await fetchT(u,{as,timeout});if(r!=null&&r!=='')return r}catch(e){}
  }
  const e=new Error('No se pudo descargar. Comprueba tu conexión o prueba a subir el archivo .txt.');e.net=true;throw e;
}

/* ---- Lematización del español --------------------------------------------
   Antes de consultar el diccionario se generan lemas candidatos a partir de
   tablas de terminaciones (verbos, plurales, género). Se prueban por orden y
   gana el primero que el diccionario reconoce; la forma original se prueba
   después de los candidatos "seguros" y antes de los ambiguos.
   --------------------------------------------------------------------------- */
const VOCALES='aeiouáéíóú';
// Quita las tildes menos las de ñ y ü
function quitaTildes(texto){
  return texto.normalize('NFD').replace(/[\u0300-\u036f]/g,(marca,pos,todo)=>{
    const previa=todo[pos-1];
    const conservar=(marca==='\u0303'&&previa==='n')||(marca==='\u0308'&&previa==='u');
    return conservar?marca:'';
  }).normalize('NFC');
}
// Cambia el último núcleo vocálico de una raíz (p. ej. ie -> e en "piens" -> "pens")
function cambiaNucleo(raiz,de,a){
  let fin=raiz.length;
  while(fin>0&&!VOCALES.includes(raiz[fin-1]))fin--;
  if(fin>=de.length&&raiz.slice(fin-de.length,fin)===de)return raiz.slice(0,fin-de.length)+a+raiz.slice(fin);
  return null;
}
// Infinitivos posibles a partir de una raíz verbal, con los cambios ortográficos habituales
function infinitivos(raiz,terminaciones){
  const lista=[];
  const anadir=x=>{if(x.length>=3&&!lista.includes(x))lista.push(x)};
  const acaba=t=>raiz.endsWith(t);
  const cambia=(t,por)=>raiz.slice(0,raiz.length-t.length)+por;
  for(const fin of terminaciones){
    const antes=[],despues=[];
    if(fin==='ar'){
      if(acaba('qu'))antes.push(cambia('qu','c'));          // busqué -> buscar
      if(acaba('gu'))antes.push(cambia('gu','g'));          // llegué -> llegar
      if(acaba('gü'))antes.push(cambia('gü','gu'));         // averigüé -> averiguar
      if(acaba('c')&&!acaba('zc'))antes.push(cambia('c','z')); // empecé -> empezar
    }else{
      if(acaba('zc'))antes.push(cambia('zc','c'));          // conozco -> conocer
      if(acaba('j'))despues.push(cambia('j','g'));          // dirijo -> dirigir
    }
    const dip1=cambiaNucleo(raiz,'ie','e');if(dip1)antes.push(dip1);   // pienso -> pensar
    const dip2=cambiaNucleo(raiz,'ue','o');if(dip2)antes.push(dip2);   // cuento -> contar
    if(fin==='ir'){
      const v1=cambiaNucleo(raiz,'i','e');if(v1)despues.push(v1);      // pidió -> pedir
      const v2=cambiaNucleo(raiz,'u','o');if(v2)despues.push(v2);      // durmió -> dormir
    }
    antes.forEach(x=>anadir(x+fin));anadir(raiz+fin);despues.forEach(x=>anadir(x+fin));
  }
  return lista;
}
// Terminaciones de formas verbales inequívocas -> posibles infinitivos (las más largas primero)
const VERBO_SEGURO=[
  ['iéramos','er ir'],['ierais','er ir'],['ieran','er ir'],['ieras','er ir'],['iera','er ir'],['iesen','er ir'],['ieses','er ir'],['iese','er ir'],
  ['ábamos','ar'],['abais','ar'],['aban','ar'],['abas','ar'],['aba','ar'],
  ['íamos','er ir'],['íais','er ir'],['ían','er ir'],['ías','er ir'],['ía','er ir'],
  ['asteis','ar'],['aron','ar'],['aste','ar'],
  ['isteis','er ir'],['ieron','er ir'],['yeron','er ir'],['iste','er ir'],
  ['iendo','er ir'],['yendo','er ir'],['ando','ar'],
  ['ió','er ir'],['yó','er ir'],['ó','ar']
].sort((a,b)=>b[0].length-a[0].length);
const FUTURO=['emos','éis','ás','án','é','á'];
const CONDICIONAL=['íamos','íais','ían','ías','ía'];
const SUBJUNTIVO_AR=['áramos','arais','aran','aras','ara','asen','ases','ase'];
// Si la palabra es "infinitivo + terminación", devuelve el infinitivo (caminaré -> caminar)
function infinitivoAntesDe(palabra,terminaciones){
  for(const t of terminaciones){
    if(!palabra.endsWith(t))continue;
    const base=palabra.slice(0,palabra.length-t.length);
    if(['ar','er','ir'].some(x=>base.endsWith(x)))return base;
  }
  return null;
}
function primeraTerminacion(palabra,lista){
  return lista.find(t=>palabra.length>t.length&&palabra.endsWith(t))||null;
}
function lemmasEs(palabra){
  const w=String(palabra).toLowerCase().trim();
  const seguros=[],ambiguos=[];
  const poner=(donde,x)=>{if(x&&x.length>=3&&x!==w&&!seguros.includes(x)&&!ambiguos.includes(x))donde.push(x)};
  const verbo=(donde,raiz,terminaciones)=>infinitivos(raiz,terminaciones).forEach(x=>poner(donde,x));
  const sinFin=n=>w.slice(0,w.length-n);
  const antesDe=(n)=>w[w.length-n-1]||'';

  // 1) formas verbales inequívocas -> infinitivo
  const inf=infinitivoAntesDe(w,FUTURO)||infinitivoAntesDe(w,CONDICIONAL);
  if(inf)poner(seguros,inf);
  else{
    const fila=VERBO_SEGURO.find(([t])=>w.length>t.length&&w.endsWith(t));
    if(fila)verbo(seguros,sinFin(fila[0].length),fila[1].split(' '));
  }

  // 2) plurales -> singular
  if(w.endsWith('iones'))poner(seguros,sinFin(5)+'ión');
  else if(w.endsWith('ones')){poner(seguros,sinFin(4)+'ón');poner(seguros,sinFin(4)+'on')}
  else if(w.endsWith('nes')&&'aeiu'.includes(antesDe(3)||'-')){
    const vocal=antesDe(3);
    const conTilde=sinFin(4)+{a:'á',e:'é',i:'í',u:'ú'}[vocal]+'n';
    const sinTilde=quitaTildes(sinFin(2));
    if(vocal==='e'){poner(seguros,sinTilde);poner(seguros,conTilde)}else{poner(seguros,conTilde);poner(seguros,sinTilde)}
  }
  else if(w.endsWith('ces'))poner(seguros,sinFin(3)+'z');
  if(!w.endsWith('ones')&&w.endsWith('es')&&!VOCALES.includes(antesDe(2)||'a')){
    poner(seguros,sinFin(2));poner(seguros,quitaTildes(sinFin(2)));
  }
  if(w.endsWith('s'))poner(seguros,sinFin(1));

  // 3) género y superlativos -> masculino singular
  const superlativo=['ísimos','ísimas','ísimo','ísima'].find(t=>w.length>t.length&&w.endsWith(t));
  if(superlativo){poner(seguros,sinFin(superlativo.length)+'o');poner(seguros,sinFin(superlativo.length))}
  else if(w.endsWith('os')||w.endsWith('as'))poner(seguros,sinFin(2)+'o');

  // 4) formas ambiguas: solo se prueban si la palabra original no existe
  if(w.endsWith('oras')||w.endsWith('ora'))poner(ambiguos,sinFin(w.endsWith('oras')?4:3)+'or');
  if(w.endsWith('onas')||w.endsWith('ona'))poner(ambiguos,sinFin(w.endsWith('onas')?4:3)+'ón');
  if(w.endsWith('ado')||w.endsWith('ada'))verbo(ambiguos,sinFin(3),['ar']);
  if(w.endsWith('ido')||w.endsWith('ida'))verbo(ambiguos,sinFin(3),['er','ir']);
  const sub=primeraTerminacion(w,SUBJUNTIVO_AR);
  if(sub)verbo(ambiguos,sinFin(sub.length),['ar']);
  let fin;
  if((fin=primeraTerminacion(w,['amos','áis'])))verbo(ambiguos,sinFin(fin.length),['ar']);
  else if((fin=primeraTerminacion(w,['emos','éis'])))verbo(ambiguos,sinFin(fin.length),['er']);
  else if((fin=primeraTerminacion(w,['imos','ís'])))verbo(ambiguos,sinFin(fin.length),['ir']);
  else if(w.endsWith('é')&&w.length>2)verbo(ambiguos,sinFin(1),['ar']);
  else if((fin=primeraTerminacion(w,['as','an','a'])))verbo(ambiguos,sinFin(fin.length),['ar']);
  else if((fin=primeraTerminacion(w,['es','en','e'])))verbo(ambiguos,sinFin(fin.length),['er','ir']);
  else if(w.endsWith('o')&&w.length>2)verbo(ambiguos,sinFin(1),['ar','er','ir']);
  if(w.endsWith('a'))poner(ambiguos,sinFin(1)+'o');

  return seguros.slice(0,4).concat([w],ambiguos.slice(0,3));
}
// Lema "oficial" que devuelve el diccionario: una sola palabra, sin números ni variantes de género
function lemaLimpio(texto,porDefecto){
  const t=String(texto||'').split(',')[0].replace(/[0-9¹²³⁴⁵⁶⁷⁸⁹⁰]/g,'').trim().toLowerCase();
  return /^\p{L}+$/u.test(t)?t:porDefecto;
}


/* ---- Filtro de definiciones (español) ------------------------------------
   Deja solo las acepciones útiles de lo que devuelve el diccionario. Quita:
   líneas con "↑", frases con "véase / véanse / para más información",
   etimologías ("Del lat.…"), notas editoriales, indicaciones de uso
   ("Ú. t. c. s.") y formas flexionadas ("forma en plural de X").
   Conserva las acepciones numeradas y las que empiezan por una categoría
   ("m.", "f.", "adj.", "verbo"…). Funciona por reglas, sin servicios externos.
   --------------------------------------------------------------------------- */
const REMISIONES=['véase','véanse','para más información'];
const ORIGEN_INICIO=(()=>{
  const lenguas=[['lat','latín'],['gr','griego'],['ár','árabe'],['fr','francés'],['it','italiano'],['ingl','inglés'],['alem','alemán'],
    ['germ','germánico'],['cat','catalán'],['port','portugués'],['occ','occitano'],['hebr','hebreo'],['pers','persa'],['vasc','vasco'],
    ['gót','gótico'],['neerl','neerlandés'],['prov','provenzal'],['gall','gallego'],['sánscr','sánscrito'],['turco','turco'],
    ['quechua','quechua'],['náhuatl','náhuatl'],['taíno','taíno']];
  const lista=['voz onomatopéyica','voz expresiva','cruce de','origen incierto','de origen incierto','etim.'];
  lenguas.forEach(([abrev,nombre])=>{lista.push('del '+abrev+'.');lista.push('del '+nombre)});
  return lista;
})();
const NOTAS_INICIO=['↑','→','⇒','nota:','nota.','observación','obs.','sin.','ant.','cf.','cfr.','ejemplo:','ej.:','ejs.:'];
const MORFO_INICIO=['forma en plural','forma plural','forma de plural','forma en femenino','forma femenina','forma de femenino',
  'forma masculina','forma de masculino','forma de participio','forma de gerundio','forma de imperativo','forma de infinitivo',
  'forma verbal','forma flexionada','forma conjugada','plural de','pl. de','femenino de','masculino de','participio de','part. de',
  'p. p. de','gerundio de','superlativo de','superlat. de','diminutivo de','dim. de','aumentativo de','aum. de',
  'primera persona','segunda persona','tercera persona','1.ª persona','2.ª persona','3.ª persona'];
const MORFO_CLAVES=['plural','participio','gerundio','imperativo','subjuntivo','indicativo','infinitivo','persona del','femenin','masculin'];
const CAT_LARGO={'m.':'sustantivo masculino','f.':'sustantivo femenino','amb.':'sustantivo ambiguo','adj.':'adjetivo','adv.':'adverbio',
  'interj.':'interjección','prep.':'preposición','conj.':'conjunción','pron.':'pronombre','tr.':'verbo transitivo',
  'intr.':'verbo intransitivo','prnl.':'verbo pronominal','impers.':'verbo impersonal','loc.':'locución','expr.':'expresión'};
const CAT_PALABRAS=['verbo','sustantivo','adjetivo','adverbio','interjección','preposición','conjunción','pronombre','locución',
  'expresión','transitivo','intransitivo','pronominal','com.'];
const esCategoria=tk=>Object.prototype.hasOwnProperty.call(CAT_LARGO,tk)||CAT_PALABRAS.includes(tk);

function esOrigen(texto){
  let l=texto.toLowerCase().trim();
  while(l.startsWith('[')||l.startsWith('('))l=l.slice(1).trim();
  return ORIGEN_INICIO.some(p=>l.startsWith(p));
}
function esNota(texto){const l=texto.toLowerCase().trim();return NOTAS_INICIO.some(p=>l.startsWith(p))}
function esMorfologica(texto){
  const l=texto.toLowerCase().trim();
  if(MORFO_INICIO.some(p=>l.startsWith(p)))return true;
  return l.startsWith('forma ')&&l.length<90&&MORFO_CLAVES.some(k=>l.includes(k));
}
// Separa el número inicial ("1.") si lo hay
function quitaNumero(linea){
  let k=0;
  while(k<linea.length&&linea[k]>='0'&&linea[k]<='9')k++;
  if(k>0&&linea[k]==='.')return {numerada:true,resto:linea.slice(k+1).trim()};
  return {numerada:false,resto:linea};
}
// Separa las categorías iniciales ("m. y f.", "adj.", "tr."…)
function quitaCategorias(linea){
  const pal=linea.split(' ');const cats=[];let i=0;
  while(i<pal.length){
    const t=pal[i].toLowerCase();
    if(esCategoria(t)){cats.push(t);i++}
    else if((t==='y'||t==='o')&&i>0&&i+1<pal.length&&esCategoria(pal[i+1].toLowerCase()))i++;
    else break;
  }
  return {cats,resto:pal.slice(i).join(' ')};
}
function esFinDeFrase(t,i){
  if(t[i]===';')return true;
  if(t[i]!=='.')return false;
  if(i===t.length-1)return true;
  const sig=t[i+2];
  return t[i+1]===' '&&!!sig&&sig!==sig.toLowerCase();       // punto seguido de mayúscula
}
// Elimina las frases (o paréntesis) que contienen alguna de las claves
function quitaFrases(texto,claves){
  let t=texto;
  for(let vuelta=0;vuelta<8;vuelta++){
    const bajo=t.toLowerCase();
    let pos=-1;
    claves.forEach(c=>{const i=bajo.indexOf(c);if(i>=0&&(pos<0||i<pos))pos=i});
    if(pos<0)break;
    const abre=t.lastIndexOf('(',pos),cierra=t.indexOf(')',pos);
    if(abre>=0&&cierra>=0&&!t.slice(abre,pos).includes(')')){t=t.slice(0,abre)+t.slice(cierra+1);continue}
    let ini=pos;while(ini>0&&!esFinDeFrase(t,ini-1))ini--;
    let fin=pos;while(fin<t.length&&!esFinDeFrase(t,fin))fin++;
    t=t.slice(0,ini)+t.slice(fin+1);
  }
  return t;
}
// Elimina indicaciones de uso como "Ú. t. c. s." o "U. m. en pl."
function quitaNotasDeUso(texto){
  const pal=texto.split(' ');const sal=[];
  const abrev=x=>!!x&&x.length<=5&&x.endsWith('.');
  for(let i=0;i<pal.length;i++){
    if((pal[i]==='Ú.'||pal[i]==='U.')&&(pal[i+1]==='m.'||pal[i+1]==='t.')){
      i++;
      while(i+1<pal.length){
        if(abrev(pal[i+1]))i++;
        else if(['en','como','y','o'].includes(pal[i+1])&&abrev(pal[i+2]))i+=2;
        else break;
      }
      continue;
    }
    sal.push(pal[i]);
  }
  return sal.join(' ');
}
function limpiaBordes(texto){
  let s=String(texto).split(' ').filter(Boolean).join(' ');
  s=s.split(' .').join('.').split(' ,').join(',').split(' ;').join(';').split('( ').join('(').split(' )').join(')');
  while(s.endsWith(';')||s.endsWith(',')||s.endsWith(':'))s=s.slice(0,-1).trim();
  return s.trim();
}
// Recibe el texto de una o varias acepciones y devuelve solo las útiles: [{t:'definición',p:'categoría'}]
function filtraDefinicionesRae(texto){
  const salida=[];
  const lineas=String(texto||'').split('\n');
  const bloque=lineas.length>1;
  for(const cruda of lineas){
    let l=cruda.trim();
    if(!l||l.startsWith('↑'))continue;
    const num=quitaNumero(l);
    l=num.resto;
    if(bloque&&!num.numerada&&!esCategoria(l.split(' ')[0].toLowerCase()))continue;   // ni numerada ni con categoría
    let cats=[];
    if(num.numerada||bloque){const c=quitaCategorias(l);cats=c.cats;l=c.resto}
    if(!l||l.startsWith('↑'))continue;
    if(esOrigen(l)||esNota(l)||esMorfologica(l))continue;
    l=limpiaBordes(quitaNotasDeUso(quitaFrases(l,REMISIONES)));
    if(l.length<3||esNota(l)||esMorfologica(l))continue;
    const pos=[...new Set(cats.map(c=>CAT_LARGO[c]||c).filter(c=>c!=='com.'))].slice(0,2).join(', ');
    salida.push({t:l,p:pos});
  }
  return salida;
}
// Aplica el filtro a una lista de acepciones [{t,p}]
function limpiaDefs(defs){
  const salida=[];
  (defs||[]).forEach(d=>filtraDefinicionesRae(d.t).forEach(f=>salida.push({p:d.p||f.p,t:f.t})));
  return salida;
}


/* ---- Definiciones breves --------------------------------------------------
   A partir de las acepciones ya filtradas de la RAE se genera, para cada
   palabra, una definición de como máximo dos enunciados, en uno de estos formatos:
   · significado cercano: la acepción principal resumida (sin paréntesis, marcas
     de uso ni ejemplos, y recortada en un límite natural);
   · sinónimos: la lista de sinónimos que da la RAE.
   El texto completo se conserva aparte (campo "full") para calificar mejor
   y para poder cambiar de estilo sin volver a consultar.
   --------------------------------------------------------------------------- */
const MAX_CARACTERES=150;
const ARTICULOS=['un','una','unos','unas','el','la','los','las'];
const mayus=t=>t?t[0].toUpperCase()+t.slice(1):t;
const minus=t=>t?t[0].toLowerCase()+t.slice(1):t;
function quitaParentesis(texto){
  let t=texto;
  for(let vuelta=0;vuelta<10;vuelta++){
    const a=t.indexOf('(');
    if(a<0)break;
    const b=t.indexOf(')',a);
    t=b<0?t.slice(0,a):t.slice(0,a)+t.slice(b+1);
  }
  return t;
}
// "Dicho de una persona: Que tiene…"  ->  "Persona que tiene…"
function reformulaDichoDe(texto){
  if(!texto.toLowerCase().startsWith('dicho de '))return texto;
  const dos=texto.indexOf(':');
  if(dos<0)return texto;
  const partes=texto.slice(9,dos).trim().split(' ');
  const resto=texto.slice(dos+1).trim();
  if(ARTICULOS.includes(partes[0].toLowerCase())&&partes.length>1)partes.shift();
  const sujeto=partes.join(' ');
  if(!resto)return texto;
  if(sujeto.length>40||sujeto.includes(' o ')||sujeto.includes(','))return resto;
  const inicio=resto.toLowerCase();
  if(inicio.startsWith('que ')||inicio.startsWith('que,'))return mayus(sujeto)+' '+minus(resto);
  return resto;
}
const esAbreviatura=x=>x.length>=2&&x.length<=6&&x.endsWith('.')&&x.indexOf('.')===x.length-1;
// Detecta marcas de uso al principio ("Am. Cen.", "coloq.", "desus.", "p. us.")
function quitaMarcas(texto){
  const pal=texto.split(' ');let i=0;
  while(i<pal.length){
    if(esAbreviatura(pal[i]))i++;
    else if(['y','o','u'].includes(pal[i])&&i>0&&i+1<pal.length&&esAbreviatura(pal[i+1]))i++;
    else break;
  }
  if(i>0&&i<pal.length)return {marcada:true,texto:mayus(pal.slice(i).join(' '))};
  // Marca de zona escrita con nombres ("Cuba y Canarias. Autobús."): frase corta solo con nombres propios
  const fin=texto.indexOf('. ');
  if(fin>0){
    const primera=texto.slice(0,fin).split(' ');
    const conectores=['y','e','o','de'];
    const nombres=primera.filter(x=>!conectores.includes(x));
    const soloNombres=nombres.length>=2&&primera.length<=4&&nombres.every(x=>x[0]===x[0].toUpperCase()&&x[0]!==x[0].toLowerCase());
    const resto=texto.slice(fin+2).trim();
    if(soloNombres&&resto.length>=3)return {marcada:true,texto:resto};
  }
  return {marcada:false,texto};
}
function partirFrases(texto){
  const piezas=[];let ini=0;
  for(let i=0;i<texto.length;i++){
    if(esFinDeFrase(texto,i)){piezas.push(texto.slice(ini,i+1));ini=i+1}
  }
  if(ini<texto.length)piezas.push(texto.slice(ini));
  return piezas.map(x=>x.trim()).map(x=>x.endsWith(';')?x.slice(0,-1).trim()+'.':x)
    .filter(x=>x.length>2).map(x=>('.…?!'.includes(x[x.length-1])?x:x+'.'));
}
// Recorta una frase larga por un límite natural (;  :  ,) o, si no lo hay, por palabras
function recortaFrase(frase){
  if(frase.length<=MAX_CARACTERES)return frase;
  const tope=frase.slice(0,MAX_CARACTERES);
  let corte=-1;
  [';',':',', '].forEach(sep=>{const i=tope.lastIndexOf(sep);if(i>corte)corte=i});
  if(corte>=45)return tope.slice(0,corte).trim()+'.';
  const sp=tope.lastIndexOf(' ');
  return tope.slice(0,sp>0?sp:tope.length).trim()+'…';
}
// Acepción -> significado breve (una frase; dos como máximo si la primera es muy corta)

/* ---- Reescritura léxica ----------------------------------------------------
   Antes de acortar, la definición se reescribe de verdad: se cambian palabras
   y expresiones propias del lenguaje de diccionario por otras equivalentes, y
   se reestructuran los patrones más habituales de la RAE ("Dicho de X: Que Y",
   "Perteneciente o relativo a X", "Acción y efecto de X"…). No es una copia
   recortada: cuando hay algo que reescribir, la frase queda redactada distinto
   aunque el sentido se mantenga.
   --------------------------------------------------------------------------- */
function esLetra(ch){return !!ch&&ch.toLowerCase()!==ch.toUpperCase()}
// Sustituye una palabra o expresión entera (respetando mayúsculas) por otra
function reemplazaExpresion(texto,buscada,reemplazo){
  const bajoT=texto.toLowerCase(),bajoB=buscada.toLowerCase();
  let salida='',i=0;
  while(true){
    const pos=bajoT.indexOf(bajoB,i);
    if(pos<0){salida+=texto.slice(i);break}
    const antes=texto[pos-1],despues=texto[pos+buscada.length];
    if(!esLetra(antes)&&!esLetra(despues)){
      const original=texto.slice(pos,pos+buscada.length);
      const rep=(esLetra(original[0])&&original[0]===original[0].toUpperCase())?mayus(reemplazo):reemplazo;
      salida+=texto.slice(i,pos)+rep;i=pos+buscada.length;
    }else{salida+=texto.slice(i,pos+1);i=pos+1}
  }
  return salida;
}
// Palabras y expresiones de registro "de diccionario" por otras más directas.
// Las expresiones más largas van primero para que no las tape una más corta.
const LEXICO_ES=[
  // Expresiones de tipo o relación
  ['perteneciente o relativo a','relacionado con'],['perteneciente y relativo a','relacionado con'],
  ['relativo o perteneciente a','relacionado con'],['relativo a','relacionado con'],['perteneciente a','relacionado con'],
  ['propio o característico de','típico de'],['propio y característico de','típico de'],
  ['propio de','típico de'],['característico de','típico de'],['peculiar de','típico de'],
  // "Que tiene la cualidad/propiedad de ser…": se quita también el "ser" para no duplicar el verbo
  ['que tiene la cualidad de ser','que es'],['que posee la cualidad de ser','que es'],
  ['que tiene la propiedad de ser','capaz de'],['que posee la propiedad de ser','capaz de'],
  ['que tiene la propiedad de','capaz de'],['que tiene la cualidad de','que es'],['que posee la cualidad de','que es'],
  ['acción y efecto de','resultado de'],['acción o efecto de','resultado de'],['acción de','hecho de'],
  ['cualidad de','característica de'],['calidad de','característica de'],
  // Carencia (invariables: no cambian con el género de lo que sigue)
  ['que carece de','sin'],['carecen de','sin'],['carece de','sin'],['falto de','sin'],['carente de','sin'],
  // Cantidad y tamaño: solo se sustituye por palabras que no cambian con el género ("grande", "en abundancia"…)
  ['de gran tamaño','muy grande'],['en gran cantidad','en abundancia'],
  ['por lo general','generalmente'],['por medio de','mediante'],['en su mayor parte','sobre todo'],
  ['de manera especial','especialmente'],['de forma especial','especialmente'],['a causa de','por'],
  ['con el fin de','para'],['en el caso de','cuando'],['dando lugar a','y provoca'],
  ['denotan','indican'],['denota','indica'],['manifiestan','muestran'],['manifiesta','muestra'],
  ['poseen','tienen'],['posee','tiene'],
  ['sumamente','muy'],['extremadamente','muy'],['notablemente','muy'],['excesivamente','demasiado'],
  ['singularmente','especialmente'],['asimismo','también'],['no obstante','aun así'],
  ['índole','tipo'],['peculiar','propio'],
  // Adjetivos: se sustituyen palabra por palabra, cada una por su equivalente del mismo género, para no
  // cambiar la concordancia con el resto de la frase (no se convierte una cantidad en un adjetivo nuevo)
  ['numerosos','muchos'],['numerosas','muchas'],['numeroso','abundante'],['numerosa','abundante'],
  ['escasos','pocos'],['escasas','pocas'],['escaso','poco'],['escasa','poca'],
  ['vastos','extensos'],['vastas','extensas'],['vasto','extenso'],['vasta','extensa'],
  ['ínfimos','mínimos'],['ínfimas','mínimas'],['ínfimo','mínimo'],['ínfima','mínima'],
  ['considerables','importantes'],['considerable','importante'],['primordial','principal'],
  ['diversos','distintos'],['diversas','distintas'],['diverso','distinto'],['diversa','distinta'],
  ['elevados','altos'],['elevadas','altas'],['elevado','alto'],['elevada','alta'],
  ['reducidos','pequeños'],['reducidas','pequeñas'],['reducido','pequeño'],['reducida','pequeña'],
  ['conjunto de','grupo de'],['procedente de','que viene de'],['destinado a','pensado para'],
];
// Aplica las sustituciones del léxico, siempre de la expresión más larga a la más corta (para que una
// expresión larga no quede a medio sustituir por culpa de una más corta contenida en ella)
const LEXICO_ES_POR_LONGITUD=LEXICO_ES.slice().sort((a,b)=>b[0].length-a[0].length);
function reescribeLexico(texto){
  let t=texto;
  LEXICO_ES_POR_LONGITUD.forEach(([buscada,reemplazo])=>{t=reemplazaExpresion(t,buscada,reemplazo)});
  t=reemplazaExpresion(t,'es ser','es');       // por si dos sustituciones dejan un verbo duplicado
  return t;
}
// Reescribe la definición: quita paréntesis, reformula "Dicho de…" y cambia el léxico de diccionario
function reescribe(texto){
  return limpiaBordes(reescribeLexico(reformulaDichoDe(quitaParentesis(texto))));
}

function acortaAcepcion(texto){
  const t=reescribe(texto);
  if(t.length<3)return '';
  const frases=partirFrases(t);
  if(!frases.length)return '';
  let salida=recortaFrase(frases[0]);
  if(frases.length>1&&salida.length<60){
    const dos=recortaFrase(frases[1]);
    if(salida.length+1+dos.length<=MAX_CARACTERES)salida+=' '+dos;
  }
  return salida;
}
function solapan(a,b){
  const A=terms(a,'es'),B=terms(b,'es');
  if(!A.length||!B.length)return false;
  let comunes=0;A.forEach(x=>{if(B.some(y=>same(x.s,y.s)))comunes++});
  return comunes/Math.min(A.length,B.length)>=0.6;
}
function eligeSinonimos(syn,palabra){
  const base=norm(palabra),vistos=new Set([base]),salida=[];
  (syn||[]).forEach(x=>{
    const t=String(x).trim().toLowerCase(),n=norm(t);
    if(!t||t.length>28||t.split(' ').length>2||vistos.has(n))return;
    if(base.length>=5&&n.startsWith(base.slice(0,base.length-2)))return;      // derivados de la misma palabra
    vistos.add(n);salida.push(t);
  });
  return salida.slice(0,5);
}
// Genera las definiciones breves. estilo: 'auto' (significado + sinónimos), 'significado' o 'sinonimos'
function simplificaDefs(defs,syn,palabra,estilo){
  const utiles=(defs||[]).filter(d=>d&&d.t&&d.k!=='sin');
  const limpias=[],marcadas=[];
  utiles.forEach(d=>{const m=quitaMarcas(d.t);(m.marcada?marcadas:limpias).push({p:d.p||'',t:m.texto})});
  const fuente=limpias.length?limpias:marcadas;
  const significados=[];
  for(const d of fuente){
    const corta=acortaAcepcion(d.t);
    if(!corta||significados.some(x=>solapan(x.t,corta)))continue;
    significados.push({t:corta,p:d.p,k:''});
    if(significados.length>=2)break;
  }
  const yaDicho=new Set(significados.map(x=>norm(x.t)));
  const sins=eligeSinonimos(syn,palabra).filter(x=>!yaDicho.has(norm(x)));   // no repetir lo que ya dice el significado
  const entradaSin=sins.length?{t:'Sinónimos: '+sins.join(', ')+'.',p:'',k:'sin'}:null;
  if(estilo==='sinonimos'&&entradaSin)return [entradaSin];
  if(estilo==='significado')return significados;
  const res=significados.slice(0,1);
  if(entradaSin)res.push(entradaSin);
  return res.length?res:significados;
}
// Sinónimos de la respuesta del diccionario sin la propia palabra
const sinsSin=(r,palabra)=>(r.syn||[]).filter(x=>norm(x)!==norm(palabra));
// Definiciones para mostrar en la ficha de una palabra recién buscada
function defsParaFicha(r,palabra){
  if(DB.lang!=='es')return r.defs.map(d=>({t:d.t,p:d.p||'',k:''}));
  const c=simplificaDefs(r.defs,r.syn||[],palabra,DB.settings.estilo||'auto');
  return c.length?c:r.defs.slice(0,1).map(d=>({t:d.t,p:d.p||'',k:''}));
}

const memo=new Map();
async function lookup(word,lang,opt={}){
  const key=lang+'|'+word.toLowerCase();
  if(memo.has(key))return memo.get(key);
  // En español se lematiza primero: se prueban los lemas candidatos y luego la forma original
  const candidatos=lang==='es'?lemmasEs(word):[word];
  const caidos=new Set();let respondio=false;
  for(const proveedor of [P.rae,P.dict,P.wikt,P.parse]){
    for(const c of candidatos){
      if(caidos.has(proveedor))break;
      try{
        const r=await proveedor(c,lang,opt);
        if(r!==undefined)respondio=true;
        if(r&&lang==='es')r.defs=limpiaDefs(r.defs);         // filtro de definiciones
        if(r&&r.defs.length){r.lemma=lang==='es'?lemaLimpio(r.word,c):c;memo.set(key,r);return r}
      }catch(e){caidos.add(proveedor)}
    }
  }
  if(!respondio){const e=new Error('offline');e.net=true;throw e}
  memo.set(key,null);return null;
}
function applyLookup(w,r){
  const completas=r.defs.map(d=>({t:d.t,p:d.p||''}));
  if(w.lang==='es'){
    w.full=completas;                                                  // texto completo (ya filtrado) de la RAE
    w.senses=simplificaDefs(completas,r.syn||[],w.word,DB.settings.estilo||'auto');
    if(!w.senses.length)w.senses=completas.slice(0,1);
  }else w.senses=completas;
  w.syn=sinsSin(r,w.word);w.dsrc=r.src||'';
}

function stripPG(t){
  let start=0;
  const s=t.search(/\*\*\*\s*START OF (THE|THIS) PROJECT GUTENBERG[^\n]*\n/i);
  if(s>=0){const m=t.slice(s).match(/^[^\n]*\n/);start=s+m[0].length}
  const e=t.search(/\*\*\*\s*END OF (THE|THIS) PROJECT GUTENBERG/i);
  return t.slice(start,e>start?e:t.length);
}
function formsToTry(word,lang){
  const f=[word];
  if(lang==='es'){
    // la lematización la hace lookup()
  }else if(lang==='en'){
    if(word.endsWith('ies'))f.push(word.slice(0,-3)+'y');
    if(word.endsWith('es'))f.push(word.slice(0,-2));
    if(word.endsWith('s'))f.push(word.slice(0,-1));
    if(word.endsWith('ed')){f.push(word.slice(0,-2),word.slice(0,-1));if(/([^aeiou])\1ed$/.test(word))f.push(word.slice(0,-3))}
    if(word.endsWith('ing')){f.push(word.slice(0,-3),word.slice(0,-3)+'e');if(/([^aeiou])\1ing$/.test(word))f.push(word.slice(0,-4))}
    if(word.endsWith('ly'))f.push(word.slice(0,-2));
  }else{
    if(word.endsWith('s'))f.push(word.slice(0,-1));
  }
  return [...new Set(f)].filter(x=>x.length>=3).slice(0,5);
}
function candidatesFrom(text,lang,existing){
  const cnt=new Map();let total=0;
  for(const m of text.matchAll(/\p{L}+/gu)){
    const tk=m[0];total++;
    const l=tk.toLowerCase();
    let o=cnt.get(l);if(!o){o={c:0,l:0};cnt.set(l,o)}
    o.c++;if(tk===l)o.l++;
  }
  const maxCount=3+Math.floor(total/60000);
  const common=COMMON[lang]||EMPTY,stop=STOP[lang]||EMPTY;
  const minLen=5,out=[];
  for(const [w,o] of cnt){
    if(w.length<minLen||w.length>18)continue;
    if(o.l===0||(o.c-o.l)>o.l)continue;              // probable nombre propio
    if(o.c>maxCount)continue;                          // demasiado frecuente en el libro
    const n=norm(w);
    if(common.has(n)||stop.has(n)||existing.has(n))continue;
    if(/(.)\1\1/.test(w)||/^[ivxlcdm]+$/.test(w))continue;
    let sc=(w.length>=8?1:w.length>=6?0.6:0.3)+(o.c===1?1:o.c===2?0.5:0)+Math.random()*1.2;
    if(lang==='es'&&/mente$/.test(w))sc-=0.9;
    if(lang==='en'&&/ly$/.test(w))sc-=0.9;
    out.push({w,sc});
  }
  out.sort((a,b)=>b.sc-a.sc);
  return {list:out.map(x=>x.w),total};
}
async function buildBook(meta,pg){
  pg.set('Leyendo el texto…',0.02);await sleep(30);
  const raw=meta.text;
  const head=raw.slice(0,6000);
  const title=meta.title||((head.match(/^Title:\s*(.+)$/mi)||[])[1]||'Libro sin título').trim();
  const author=meta.author||((head.match(/^Author:\s*(.+)$/mi)||[])[1]||'').trim();
  const body=stripPG(raw);
  const lang=DB.lang;
  const existing=new Set(DB.words.filter(w=>w.lang===lang).map(w=>norm(w.word)));
  pg.set('Buscando las palabras menos comunes…',0.08);await sleep(30);
  const {list,total}=candidatesFrom(body,lang,existing);
  if(total<300)throw new Error('El texto es demasiado corto o no parece un libro.');
  const pages=Math.max(1,Math.round(total/300));
  const target=Math.max(10,Math.ceil(pages/100)*DB.settings.perHundred);
  const pool=list.slice(0,Math.max(target*12,60));
  if(!pool.length)throw new Error('No he encontrado palabras nuevas poco comunes en este texto.');
  const book={id:uid(),lang,title,author,pg:meta.pg||null,pages,count:0,added:Date.now()};
  const added=[],used=new Set();
  let idx=0,netFail=0,offline=false,attempts=0;
  const conc=4;
  const worker=async()=>{
    while(!pg.stop&&!offline&&added.length<target&&idx<pool.length){
      const cand=pool[idx++];attempts++;
      pg.set(`Buscando definiciones… ${added.length}/${target}`,0.12+0.86*Math.min(1,added.length/target));
      let found=null,netErr=false;
      for(const f of formsToTry(cand,lang)){
        if(used.has(norm(f))||existing.has(norm(f)))continue;
        try{const r=await lookup(f,lang,{bulk:true});if(r){found={form:r.lemma||f,r};break}}catch(e){netErr=true;break}
      }
      if(found){                                     // el lema ya estaba, ya se añadió o es demasiado común
        const ln=norm(found.form);
        if(used.has(ln)||existing.has(ln)||(COMMON[lang]||EMPTY).has(ln)){found=null;netErr=false}
      }
      if(found&&lang==='en'){                       // descarta palabras frecuentes (más de 3 por millón)
        const f=await freqEn(found.form);
        if(f!=null&&f>3){found=null;netErr=false}
      }
      if(found){
        netFail=0;
        if(added.length<target&&!used.has(norm(found.form))){
          used.add(norm(found.form));
          const w={id:uid(),lang,word:found.form,senses:[],syn:[],src:'book',book:book.id,fav:false,off:false,score:null,last:null,tries:0,dsrc:''};
          if(norm(cand)!==norm(found.form))w.orig=cand;
          applyLookup(w,found.r);added.push(w);
        }
      }else if(netErr){netFail++;if(netFail>=6&&!added.length)offline=true}
    }
  };
  await Promise.all(Array.from({length:conc},worker));
  let pending=0;
  if(offline){
    // sin conexión con el diccionario: guardamos las palabras y se completarán después
    for(const cand of pool.slice(0,target)){
      added.push({id:uid(),lang,word:cand,senses:[],syn:[],src:'book',book:book.id,fav:false,off:false,score:null,last:null,tries:0,dsrc:''});pending++;
    }
  }
  book.count=added.length;
  if(added.length){DB.books.push(book);DB.words.push(...added);save()}
  return {title,pages,target,added:added.length,pending,cancelled:pg.stop};
}
async function freqEn(w){
  try{
    const j=await fetchT('https://api.datamuse.com/words?sp='+enc(w)+'&md=f&max=1',{timeout:6000});
    const it=j&&j[0];if(!it||it.word!==w)return null;
    const t=(it.tags||[]).find(x=>x.startsWith('f:'));return t?parseFloat(t.slice(2)):null;
  }catch(e){return null}
}

function cardsFor(pool){
  let list=wordsOf().filter(studyable);
  if(pool==='book')list=list.filter(w=>w.book===UI.book);
  else if(pool==='manual')list=list.filter(w=>w.src==='manual');
  else if(pool==='fav')list=list.filter(w=>w.fav);
  else if(pool==='worst'){
    const rated=shuffle(list.filter(w=>w.score!=null)).sort((a,b)=>a.score-b.score);
    return rated.concat(shuffle(list.filter(w=>w.score==null))).slice(0,10);
  }

}

async function fillDef(){
  const word=$('#wf-word').value.trim();
  if(!word)return toast('Escribe primero la palabra');
  const btn=$('[data-act=fillDef]');btn.disabled=true;btn.textContent='Buscando…';
  try{
    const r=await lookup(word,DB.lang,{});
    if(!r)toast('No encontré esa palabra en el diccionario');
    else{
      WS.r=r;WS.comprobada=r.lemma||word;
      if(r.lemma&&norm(r.lemma)!==norm(word)){WS.orig=WS.orig||word;$('#wf-word').value=r.lemma;toast(`Lematizada: «${word}» → «${r.lemma}»`)}
      else toast('Definición de '+r.src);
      WS.fichas=defsParaFicha(r,r.lemma||word);
      $('#wf-def').value=WS.fichas.map(d=>d.t).join('\n');if(!$('#wf-syn').value.trim())$('#wf-syn').value=sinsSin(r,r.lemma||word).join(', ')}
  }catch(e){toast('Sin conexión con el diccionario')}
  btn.disabled=false;btn.textContent='Buscar en el diccionario';
}
async function saveWord(){
  let word=$('#wf-word').value.trim();
  if(!word)return toast('Escribe la palabra');
  const dup=DB.words.find(x=>x.lang===DB.lang&&norm(x.word)===norm(word)&&x.id!==WS.id);
  if(dup)return toast('Esa palabra ya está en la base de datos');
  let defText=$('#wf-def').value.trim();
  let r=WS.r;
  let noverif=false;
  const b=$('[data-act=saveWord]');
  // Si falta la definición, se busca en el diccionario (como antes). Si ya hay una definición propia pero
  // la palabra tal cual no se ha comprobado todavía, se comprueba igualmente que la palabra existe.
  if(!defText||WS.comprobada!==word){
    b.disabled=true;b.textContent=defText?'Comprobando…':'Buscando definición…';
    try{
      r=await lookup(word,DB.lang,{});
      if(r){
        WS.comprobada=word;
        if(!defText){
          WS.fichas=defsParaFicha(r,r.lemma||word);
          defText=WS.fichas.map(d=>d.t).join('\n');if(!$('#wf-syn').value.trim())$('#wf-syn').value=sinsSin(r,r.lemma||word).join(', ');
          if(r.lemma&&norm(r.lemma)!==norm(word)){
            if(DB.words.some(x=>x.lang===DB.lang&&norm(x.word)===norm(r.lemma)&&x.id!==WS.id)){b.disabled=false;b.textContent='Guardar';return toast(`«${r.lemma}» (lema de «${word}») ya está en la base de datos`)}
            WS.orig=WS.orig||word;word=r.lemma;WS.comprobada=word;$('#wf-word').value=word;toast(`Guardada como «${word}»`);
          }
        }
      }else{
        b.disabled=false;b.textContent='Guardar';
        const seguir=await confirmarInline(`No he encontrado «${word}» en el diccionario de ${curLang().name}. Puede ser una palabra poco frecuente, de otra región, o tener una errata.`);
        if(!seguir)return;
        WS.comprobada=word;noverif=true;
        b.disabled=true;b.textContent=defText?'Comprobando…':'Buscando definición…';
      }
    }catch(e){if(!defText)toast('Guardada sin definición (sin conexión)')}
    b.disabled=false;b.textContent='Guardar';
  }
  const old=WS.id?DB.words.find(x=>x.id===WS.id):null;
  const meta=new Map();
  (r?r.defs:[]).forEach(d=>meta.set(d.t,{p:d.p||'',k:''}));
  (old?old.senses:[]).forEach(x=>meta.set(x.t,{p:x.p||'',k:x.k||''}));
  (WS.fichas||[]).forEach(x=>meta.set(x.t,{p:x.p||'',k:x.k||''}));
  const senses=defText.split('\n').map(t=>t.trim()).filter(Boolean).map(t=>{const m=meta.get(t)||{p:'',k:''};return {t,p:m.p,k:m.k}});
  const full=(r&&DB.lang==='es')?r.defs.map(d=>({t:d.t,p:d.p||''})):null;
  const syn=$('#wf-syn').value.split(',').map(s=>s.trim()).filter(Boolean);
  const fav=$('#wf-fav').checked,off=$('#wf-off').checked;
  if(old){Object.assign(old,{word,senses,syn,fav,off,noverif:r?false:(noverif||old.noverif)});if(full)old.full=full;if(r&&!old.dsrc)old.dsrc=r.src;if(WS.orig&&!old.orig)old.orig=WS.orig}
  else DB.words.push({id:uid(),lang:DB.lang,word,senses,syn,src:'manual',book:null,fav,off,score:null,last:null,tries:0,dsrc:r?r.src:'',orig:WS.orig||'',full:full||[],noverif});
  save();closeSheet();render();toast('Guardada');
}
